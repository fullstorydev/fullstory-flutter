# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      # must align with the tag-pattern configured on pub.dev, often just replace
      - "v[0-9]+.[0-9]+.[0-9]+" # tag-pattern on pub.dev: 'v{{version}}'
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
      - uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up local.properties
        run: bash .github/workflows/create_properties.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: cd example && flutter pub get

      - name: Install example module dependencies
        run: cd example_module/flutter_module && flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Optionally remove '--fatal-infos' for less strict analysis.
      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run library tests
        run: flutter test

      - name: Run example app tests
        run: cd example && flutter test

      - name: Build hosted-style iOS consumer for a device with Swift Package Manager
        run: |
          # Build from a clean archive in the directory shape used by hosted
          # packages. The publish dry-run below separately verifies its contents.
          plugin_version="$(awk '/^version:/ { print $2; exit }' "$GITHUB_WORKSPACE/pubspec.yaml")"
          plugin_dir="$RUNNER_TEMP/fullstory_flutter-$plugin_version"
          consumer_dir="$RUNNER_TEMP/fullstory_flutter_consumer"
          mkdir -p "$plugin_dir"
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$plugin_dir"
          flutter config --enable-swift-package-manager
          flutter create \
            --empty \
            --no-pub \
            --org com.fullstory \
            --platforms ios \
            "$consumer_dir"
          cd "$consumer_dir"
          flutter pub add "fullstory_flutter:{path: $plugin_dir}"
          grep -Eq '"name"[[:space:]]*:[[:space:]]*"fullstory_flutter"' \
            .flutter-plugins-dependencies
          flutter build ios --release --no-codesign
          grep -F '.product(name: "fullstory-flutter", package: "fullstory_flutter")' \
            ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift

      - name: Build iOS integration test with Swift Package Manager
        run: |
          # The example uses a path dependency to the repository root. Flutter
          # 3.44.x incorrectly derives its Swift package identity from that
          # directory's basename, so stage it under the Dart package name.
          # https://github.com/flutter/flutter/issues/186881
          git clone --local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fullstory_flutter"
          cd "$RUNNER_TEMP/fullstory_flutter/example"
          flutter pub get
          flutter config --enable-swift-package-manager
          if ! flutter build ios --simulator -t integration_test/plugin_integration_test.dart; then
            echo "Generated plugin package:"
            cat ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift || true
            echo "Plugin package symlinks:"
            find ios/Flutter/ephemeral/Packages/.packages -maxdepth 1 -print -exec ls -ld {} \; || true
            exit 1
          fi

      - name: Build iOS example with CocoaPods
        working-directory: example
        run: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get
          flutter build ios --simulator

      - name: Install Dependencies
        run: cd example/ios && pod install

      - name: Run iOS unit tests
        run: |
          cd example/ios && \
            xcodebuild test \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
              -disableAutomaticPackageResolution \
              CODE_SIGNING_ALLOWED='NO'

      - name: Accept android licenses
        run: yes | flutter doctor --android-licenses

      - name: Run Android unit tests
        # the 'build apk --config-only' is a workaround for
        # https://github.com/flutter/flutter/issues/169336
        run: cd example && flutter build apk --config-only && cd android && ./gradlew :fullstory_flutter:test

      # Revert files mutated by the native builds and pod install
      # to avoid angering flutter pub publish
      - name: Native build cleanup
        run: git restore example/android/gradle.properties example/ios/Podfile.lock example/ios/Runner.xcodeproj/project.pbxproj

      - name: Test docs generation
        run: dart doc --dry-run

      # dry run publish
      - run: ./generate_example_md.sh > example/example.md
      - run: cat example/example.md
      - run: flutter pub publish --dry-run

  swiftpm-baseline:
    name: SwiftPM (Flutter 3.44.7 baseline)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
      - run: flutter --version

      - name: Build hosted-style iOS consumer for a device
        run: |
          plugin_version="$(awk '/^version:/ { print $2; exit }' "$GITHUB_WORKSPACE/pubspec.yaml")"
          plugin_dir="$RUNNER_TEMP/fullstory_flutter-$plugin_version"
          consumer_dir="$RUNNER_TEMP/fullstory_flutter_consumer"
          mkdir -p "$plugin_dir"
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$plugin_dir"
          flutter config --enable-swift-package-manager
          flutter create \
            --empty \
            --no-pub \
            --org com.fullstory \
            --platforms ios \
            "$consumer_dir"
          cd "$consumer_dir"
          flutter pub add "fullstory_flutter:{path: $plugin_dir}"
          grep -Eq '"name"[[:space:]]*:[[:space:]]*"fullstory_flutter"' \
            .flutter-plugins-dependencies
          flutter build ios --release --no-codesign
          grep -F '.product(name: "fullstory-flutter", package: "fullstory_flutter")' \
            ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift

      - name: Build iOS integration-test target
        run: |
          # Work around https://github.com/flutter/flutter/issues/186881 for
          # the example's path dependency.
          git clone --local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fullstory_flutter"
          cd "$RUNNER_TEMP/fullstory_flutter/example"
          flutter pub get
          flutter config --enable-swift-package-manager
          flutter build ios --simulator -t integration_test/plugin_integration_test.dart

  publish:
    # only run tags, after the tests have passed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, swiftpm-baseline]

    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # This creates the OIDC token that the publish step uses
      - uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # create an example/example.md file with all of the example code
      # otherwise pub.dev defaults to the contents of lib/main.md which is fairly unhelpful
      - run: ./generate_example_md.sh > example/example.md

      - name: Publish
        # --force is required because otherwise it asks for a confirmation and times out waiting
        run: flutter pub publish --force
